<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to save your OOTD closet." />
    <title>Sign in — OOTD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <main class="login-wrap">
      <a class="brand login-brand" href="index.html">ootd<span>°</span></a>
      <section class="login-card" aria-labelledby="loginTitle">
        <div class="eyebrow"><span></span> Welcome to your closet</div>
        <h1 id="loginTitle">Dress like<br />yourself.</h1>
        <p>Create a profile to keep your shirts, shoes, and favorite pieces saved for next time.</p>
        <form id="loginForm" class="login-form">
          <label for="displayName">Your name</label>
          <input id="displayName" name="displayName" required minlength="2" maxlength="30" autocomplete="name" placeholder="e.g. Casey" />
          <label for="email">Email address</label>
          <input id="email" name="email" required type="email" autocomplete="email" placeholder="you@example.com" />
          <label for="sex">Sex <span class="optional">(optional)</span></label>
          <select id="sex" name="sex">
            <option value="">Prefer not to say</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
            <option value="Intersex">Intersex</option>
            <option value="Another identity">Another identity</option>
          </select>
          <button class="generate-button" type="submit">Continue to my closet <span>→</span></button>
        </form>
        <p class="login-note">This demo remembers your closet on this device. A real site would connect this form to a secure account service.</p>
      </section>
    </main>
    <script src="login.js"></script>
  </body>
</html>
